name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fcommerce_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fcommerce_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend checks
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/fcommerce_ci
          REDIS_URL: redis://localhost:6379
          APP_ORIGIN: http://localhost:3000
          ASSET_SIGNING_SECRET: ci-asset-signing-secret-minimum-32-chars
          METRICS_TOKEN: ci-metrics-token
          AUTH_OTP_SECRET: ci-auth-otp-secret-minimum-32-characters
          META_APP_ID: ci-meta-app
          META_APP_SECRET: ci-meta-app-secret
          META_OAUTH_REDIRECT_URI: http://localhost:4000/api/v1/meta/oauth/callback
          META_TOKEN_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          META_WEBHOOK_SECRET: ci-meta-webhook-secret
          META_WEBHOOK_VERIFY_TOKEN: ci-meta-token
        run: |
          npm ci
          npm run check:full

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH password helper
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "APP_DIR='${{ vars.VPS_APP_DIR }}' BRANCH='main' REPO_URL='https://github.com/britsync07-prog/e-commerce.git' bash -s" \
            < ops/vps/deploy.sh
