services:
  api:
    build: .
    command: npm run dev
    env_file: .env
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
      - backend-storage:/app/storage
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: npm run dev
    env_file: .env
    volumes:
      - .:/app
      - /app/node_modules
      - backend-storage:/app/storage
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fcommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
  backend-storage:
